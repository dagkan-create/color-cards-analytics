    const boosters = section('Booster kazanımı ve kullanımı', 'Extra’da “Başlangıç” iki ücretsiz kullanımdır.', table(g, cols, [0, 1, 2, 3]));
    const lives = section('Canlar', 'Can kaybı nedeni ve 0 cana düşünce ne oldu.',
      barRows(g, [
        { name: 'Kayıp · fail ekranını kapatma', get: (m) => ratio(m.lifeFail, m.lifeFail + m.lifeRestart), third: (m) => m.lifeFail, f3: F.int },
        { name: 'Kayıp · Settings restart', get: (m) => ratio(m.lifeRestart, m.lifeFail + m.lifeRestart), third: (m) => m.lifeRestart, f3: F.int },
      ].concat(ZERO.map(([k, name]) => ({ name: '0 can → ' + name, get: (m) => ratio(m.zero[k], m.zeroEvents), third: (m) => m.zero[k], f3: F.int })))
        .concat([{ name: '0 can → bir daha dönmedi', get: (m) => ratio(m.zero.gone, m.zeroEvents), third: (m) => m.zero.gone, f3: F.int }]),
      { h1: 'Durum', h2: 'Pay', h3: 'Adet' }));
    const treasure = section('Free · Treasure', 'Saatlik 10 altın ve günlük reklam zinciri.',
      barRows(g, [
        { name: 'Ücretsiz 10 altın alan oyuncu', get: (m) => m.trUsers, third: (m) => ratio(m.tr.free, m.tr.days), f3: F.dec },
        { name: 'Zincir 1 · 90 altın', get: (m) => ratio(m.tr.chain[0], m.tr.days) },
        { name: 'Zincir 2 · Burn', get: (m) => ratio(m.tr.chain[1], m.tr.days) },
        { name: 'Zincir 3 · 20 dk sınırsız can', get: (m) => ratio(m.tr.chain[2], m.tr.days) },

      ], { h1: 'Adım', h2: 'Oran', h3: 'Gün başına' }));
    return kpis + balance + flows + boosters + '<div class="grid-2">' + lives + treasure + '</div>';
  }

  // ---------- 08 Permissions ----------
  const PERMS = [
    ['att', 'ATT · reklam takibi', 'iOS'],
    ['notif', 'Bildirim', 'iOS + Android'],
    ['consent', 'Veri izni · KVKK/GDPR', 'İzin gereken ülkeler'],
  ];
  function computePermissions(ds) {
    const from = dayIndexOf(state.f.from);
    const to = dayIndexOf(state.f.to);
    const days = [];
    for (let d = from; d <= to; d++) days.push(d);
    const retained = (list, n) => {
      const seen = list.filter((p) => p.installDay + n <= S.OBS_END);
      return ratio(seen.filter((p) => p.active.includes(n)).length, seen.length);
    };
    const arpdau = (list) => ratio(sum(list, (p) => sumObj(p.revIap) + sumObj(p.revAd)), sum(list, (p) => p.active.length));
    const out = { days };
    for (const [key] of PERMS) {
      const eligible = ds.players.filter((p) => p.perm[key].eligible);
      const asked = eligible.filter((p) => p.perm[key].prompted);
      const yes = asked.filter((p) => p.perm[key].granted);
      const no = asked.filter((p) => !p.perm[key].granted);
      out[key] = {
        eligible: eligible.length,
        asked: ratio(asked.length, eligible.length),
        askedN: asked.length,
        granted: ratio(yes.length, asked.length),
        denied: ratio(no.length, asked.length),
        current: ratio(asked.filter((p) => p.perm[key].current).length, asked.length),
        level: quantile(asked.map((p) => p.perm[key].level), 0.5),
        d1Yes: retained(yes, 1),
        d1No: retained(no, 1),
        d7Yes: retained(yes, 7),
        d7No: retained(no, 7),
        arpYes: arpdau(yes),
        arpNo: arpdau(no),
        byDay: days.map((d) => {
          const a = asked.filter((p) => p.installDay === d);
          return ratio(a.filter((p) => p.perm[key].granted).length, a.length);
        }),
      };
    }
    return out;
  }

  function filterBar() {
    const f = state.f;
    const opt = (key, options) => '<select data-filter="' + key + '">' + options.map((o) => '<option value="' + o[0] + '"' + (String(f[key]) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>';
    let html = '<div class="card filters"><div class="filter-row">'
      + '<div class="field"><label>Kurulum kohortu</label><div class="range"><input type="date" data-filter="from" value="' + f.from + '" min="2026-09-01" max="2026-09-30"> – <input type="date" data-filter="to" value="' + f.to + '" min="2026-09-01" max="2026-09-30"></div></div>'
      + (state.compare === 'acq' ? '' : '<div class="field"><label>Edinim</label>' + opt('acq', [['all', 'Paid + Organik'], ['paid', 'Paid'], ['organic', 'Organik']]) + '</div>')
      + (state.compare === 'payer' ? '' : '<div class="field"><label>Ödeme durumu</label>' + opt('payerType', [['all', 'Payer + Non-payer'], ['payer', 'Payer'], ['nonpayer', 'Non-payer']]) + '</div>')
      + '<div class="field"><label>Platform</label>' + opt('platform', [['all', 'iOS + Android'], ['ios', 'iOS'], ['android', 'Android']]) + '</div>'
      + '<div class="field"><label>Ülke</label>' + opt('country', [['all', 'Tüm ülkeler'], ['TR', 'Türkiye'], ['US', 'ABD'], ['DE', 'Almanya'], ['BR', 'Brezilya'], ['OTHER', 'Diğer']]) + '</div>'
      + versionFields(opt);
    if (state.tab === 'level') {
      html += '<div class="field"><label>Level’a giriş günü</label>' + opt('entryDay', [['all', 'Tüm günler'], ['d0', 'D0'], ['d1', 'D1–3'], ['d4', 'D4–7'], ['d8', 'D8+']]) + '</div>'
        + '<div class="field"><label>Level’a girişte ödeme</label>' + opt('payer', [['all', 'Payer + Non-payer'], ['payer', 'Payer'], ['nonpayer', 'Non-payer']]) + '</div>'
        + '<div class="field"><label>Persentil</label>' + opt('pct', [['50', 'P50'], ['75', 'P75'], ['90', 'P90'], ['99', 'P99']]) + '</div>'
        + '<div class="field"><label>Level aralığı</label><div class="range"><input type="number" min="1" max="60" data-filter="lvFrom" value="' + f.lvFrom + '"> – <input type="number" min="1" max="60" data-filter="lvTo" value="' + f.lvTo + '"></div></div>';
    }
    const inFilter = S.players.filter((p) => playerPass(p, f));
    const count = state.compare === 'version'
      ? [state.verA, state.verB].map((v) => v + ': ' + F.int(inFilter.filter((p) => p.version === v).length)).join(' · ') + ' oyuncu'
      : F.int(inFilter.length) + ' oyuncu';
    const modes = [['none', 'Yok'], ['acq', 'Paid vs Organik'], ['payer', 'Payer vs Non-payer']];
    if (state.tab === 'onboarding') modes.push(['version', 'Sürüm A vs B']);
    const current = state.compare || 'none';
    html += '</div><div class="filter-foot"><div class="sample">' + count + ' · gözlem sonu ' + shortDate(S.OBS_END) + '.2026 · sentetik veri' + (f.payerType !== 'all' || state.compare === 'payer' ? ' · Payer: gözlem süresinde en az 1 satın alma' : '') + '</div>'
      + '<div class="toolbar"><span class="sample">Kırılım</span><div class="seg">' + modes.map((m) => '<button data-action="compare" data-key="' + m[0] + '" class="' + (m[0] === current ? 'on' : '') + '">' + m[1] + '</button>').join('') + '</div>'
      + '<button class="btn" data-action="reset">Sıfırla</button></div></div></div>';
    return html;
  }

  const VERSIONS = ['1.0.0', '1.0.1', '1.1.0'];
  // In the version split the single version filter becomes two pickers, A and B.
  function versionFields(opt) {
    if (state.compare !== 'version') {
      return '<div class="field"><label>Sürüm</label>' + opt('version', [['all', 'Tüm sürümler']].concat(VERSIONS.map((v) => [v, v]))) + '</div>';
    }
    const pick = (key) => '<select data-state="' + key + '">' + VERSIONS.map((v) => '<option value="' + v + '"' + (state[key] === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>';
    return '<div class="field"><label><i class="dot paid"></i>Sürüm A</label>' + pick('verA') + '</div>'
      + '<div class="field"><label><i class="dot organic"></i>Sürüm B</label>' + pick('verB') + '</div>';
  }

  function renderNav() {
    document.getElementById('nav-list').innerHTML = TABS.map((t, i) => '<button class="nav-item' + (t.id === state.tab ? ' active' : '') + '" data-action="tab" data-key="' + t.id + '"><span>' + t.name + '</span><small>' + String(i).padStart(2, '0') + '</small></button>').join('');
  }

  function render() {
    if (state.compare === 'version' && state.tab !== 'onboarding') state.compare = false; // version split exists only on Onboarding
    renderNav();
    const tab = TABS.find((t) => t.id === state.tab);
    const [fn, desc] = RENDER[state.tab];
    const filters = state.tab === 'event' ? '' : filterBar(); // nothing to filter until events exist
    view.innerHTML = '<div class="page-head"><div><h1>' + tab.name + '</h1>' + (desc ? '<p>' + desc + '</p>' : '') + '</div></div>' + filters + fn();
    if (state.drawerLevel !== null) openDrawer(state.drawerLevel);
  }

  function openDrawer(lv) {
    state.drawerLevel = lv;
    document.getElementById('drawer').innerHTML = renderLevelDrawer(lv);
    document.getElementById('drawer').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  }
  function closeDrawer() {
    state.drawerLevel = null;
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const key = el.dataset.key;
    if (el.tagName === 'SELECT') return;
    if (action === 'tab') {
      state.tab = key;
      try {
        history.replaceState(null, '', '#' + key); // a sandboxed viewer frame may refuse history writes
      } catch (err) {}
      closeDrawer();
      render();
      window.scrollTo(0, 0);
    } else if (action === 'compare') {
      state.compare = key === 'none' ? false : key;
      render();
    } else if (action === 'reset') {
      state.f = Object.assign({}, DEFAULT_FILTERS);
      state.compare = false;
      render();
    } else if (action === 'permMetric') {
      state.permMetric = key;
      render();
    } else if (action === 'dailyMetric') {
      state.dailyMetric = key;
      render();
    } else if (action === 'trend') {
      state.trend = key;
      render();
    } else if (action === 'level') {
      openDrawer(+key);
    } else if (action === 'close') {
      closeDrawer();
    }
  });
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.state) {
      const other = el.dataset.state === 'verA' ? 'verB' : 'verA';
      if (state[other] === el.value) state[other] = state[el.dataset.state]; // picking the other side's version swaps A and B
      state[el.dataset.state] = el.value;
      render();
    } else if (el.dataset.filter) {
      const key = el.dataset.filter;
      let v = el.value;
      if (key === 'lvFrom' || key === 'lvTo') v = Math.max(1, Math.min(S.MAX_LEVEL, parseInt(v, 10) || 1));
      state.f[key] = v;
      if (state.f.lvFrom > state.f.lvTo) state.f.lvTo = state.f.lvFrom; // keep the range non-empty
      if (state.f.from > state.f.to) state.f.to = state.f.from;
      render();
    } else if (el.dataset.action) {
      state[el.dataset.action] = el.value;
      render();
    }
  });
  document.addEventListener('mousemove', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) {
      tip.style.display = 'none';
      return;
    }
    tip.innerHTML = el.dataset.tip;
    tip.style.display = 'block';
    const x = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14);
    tip.style.left = x + 'px';
    tip.style.top = e.clientY + 14 + 'px';
  });

  render();
})();
</script>
</body>
</html>
